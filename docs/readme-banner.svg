<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What Do You Do animated README banner</title>
  <desc id="desc">A soft yellow and dark ink banner with moving local-first activity labels.</desc>
  <rect width="1200" height="220" rx="34" fill="#1F211D"/>
  <rect x="18" y="18" width="1164" height="184" rx="26" fill="#F4F3EC"/>
  <circle cx="90" cy="86" r="22" fill="#FFD84D"/>
  <circle cx="116" cy="112" r="22" fill="#5ED9E8"/>
  <circle cx="90" cy="86" r="11" fill="#F4F3EC"/>
  <circle cx="116" cy="112" r="11" fill="#F4F3EC"/>
  <text x="158" y="84" fill="#1F211D" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="800">What Do You Do</text>
  <text x="162" y="124" fill="#62645C" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">private activity OS for focus, hackathons, reminders, and the AI agent layer</text>
  <g>
    <rect x="760" y="54" width="310" height="48" rx="24" fill="#FFD84D"/>
    <text x="786" y="84" fill="#1F211D" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">
      <tspan>coding</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="786" y="84" fill="#1F211D" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" opacity="0">
      <tspan>researching</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="916" y="84" fill="#1F211D" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">
      <tspan>local only</tspan>
    </text>
  </g>
  <g transform="translate(760 120)">
    <rect width="84" height="18" rx="9" fill="#DFF0E4"/>
    <rect x="96" width="126" height="18" rx="9" fill="#DDEEF0"/>
    <rect x="234" width="72" height="18" rx="9" fill="#F3D6C5"/>
    <rect y="32" width="184" height="18" rx="9" fill="#FFECA4"/>
    <rect x="196" y="32" width="110" height="18" rx="9" fill="#1F211D"/>
    <animateTransform attributeName="transform" type="translate" values="760 120;782 120;760 120" dur="4.5s" repeatCount="indefinite"/>
  </g>
</svg>
